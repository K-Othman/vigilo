name: Terraform destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm'
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-infra
  cancel-in-progress: false

defaults:
  run:
    working-directory: terraform/infra

jobs:
  destroy:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assume apply role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: eu-west-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Init
        run: terraform init -input=false

      - name: Plan destroy
        run: terraform plan -destroy -input=false -out=destroy.tfplan

      - name: Destroy
        run: terraform apply -input=false destroy.tfplan