services:
  db:
    image: postgres:16
    container_name: vigilo-db
    environment:
      POSTGRES_USER: vigilo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vigilo
    ports:
      - "5432:5432"
    volumes:
      - vigilo-db-data:/var/lib/postgresql

volumes:
  vigilo-db-data: